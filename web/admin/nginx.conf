# наружу nginx не смотрит: все запросы приходят через gateway
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # add_header в location перекрывает серверные целиком, поэтому заголовки заданы в каждом location

    # у файлов из assets хэш в имени, их можно кэшировать навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # всё остальное - маршруты SPA, index.html не кэшируем, чтобы новый релиз подхватывался сразу
    # style-src 'unsafe-inline' нужен CodeMirror: он вставляет свои стили через <style>
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok";
    }
}
