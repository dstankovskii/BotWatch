name: botwatch

x-dotnet: &dotnet
  restart: unless-stopped
  # в aspnet-образе нет curl и wget, поэтому запрос пишем руками через /dev/tcp из bash
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
    interval: 15s
    timeout: 5s
    start_period: 30s
    retries: 3
  environment: &dotnet-env
    RabbitMq__Host: rabbitmq
    RabbitMq__Username: ${RABBITMQ_USER}
    RabbitMq__Password: ${RABBITMQ_PASSWORD}
    Seq__Url: http://seq:5341
    # трассы в Seq по OTLP: в одном окне видно и логи, и путь сообщения через брокер
    OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  depends_on: &dotnet-deps
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
      INCIDENTS_DB_PASSWORD: ${INCIDENTS_DB_PASSWORD}
      TGPROBE_DB_PASSWORD: ${TGPROBE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15680:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:2025
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data
    ports:
      - "127.0.0.1:5380:80"

  # единственный вход снаружи: логин, /api/* в сервисы, админка и статус-страница
  gateway:
    <<: *dotnet
    build:
      context: ../..
      args:
        PROJECT: src/Gateway/BotWatch.Gateway
        APP: BotWatch.Gateway
    environment:
      Seq__Url: http://seq:5341
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      ConnectionStrings__Gateway: Host=postgres;Database=gateway;Username=gateway;Password=${GATEWAY_DB_PASSWORD}
      Services__Monitoring: http://monitoring:8080
      Services__Incidents: http://incidents:8080
      Services__Admin: http://admin:8080
      Gateway__BehindProxy: ${BEHIND_PROXY:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BOTWATCH_PORT:-8080}:8080"

  admin:
    build:
      context: ../../web/admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  monitoring:
    <<: *dotnet
    build:
      context: ../..
      args:
        PROJECT: src/Monitoring/BotWatch.Monitoring.Api
        APP: BotWatch.Monitoring.Api
    environment:
      <<: *dotnet-env
      ConnectionStrings__Monitoring: Host=postgres;Database=monitoring;Username=monitoring;Password=${MONITORING_DB_PASSWORD}

  incidents:
    <<: *dotnet
    build:
      context: ../..
      args:
        PROJECT: src/Incidents/BotWatch.Incidents.Api
        APP: BotWatch.Incidents.Api
    environment:
      <<: *dotnet-env
      ConnectionStrings__Incidents: Host=postgres;Database=incidents;Username=incidents;Password=${INCIDENTS_DB_PASSWORD}
      Encryption__Key: ${ENCRYPTION_KEY}
      Heartbeat__Url: ${HEARTBEAT_URL:-}

  http-probe:
    <<: *dotnet
    build:
      context: ../..
      args:
        PROJECT: src/Probes/BotWatch.Probe.Http
        APP: BotWatch.Probe.Http
    depends_on:
      rabbitmq:
        condition: service_healthy

  # аккаунтами делится через Lease, поэтому реплик может быть несколько: docker compose up --scale tg-probe=2
  tg-probe:
    <<: *dotnet
    build:
      context: ../..
      args:
        PROJECT: src/Probes/BotWatch.Probe.Telegram
        APP: BotWatch.Probe.Telegram
    environment:
      <<: *dotnet-env
      ConnectionStrings__TgProbe: Host=postgres;Database=tgprobe;Username=tgprobe;Password=${TGPROBE_DB_PASSWORD}
      Encryption__Key: ${ENCRYPTION_KEY}
      # 0 вместо пустой строки: тогда проба упадёт с понятным "ApiId is not configured", а не на разборе числа
      Telegram__ApiId: ${TELEGRAM_API_ID:-0}
      Telegram__ApiHash: ${TELEGRAM_API_HASH}
      Telegram__Proxy: ${TELEGRAM_PROXY:-}
      Telegram__MtProxyUrl: ${TELEGRAM_MTPROXY_URL:-}

  # метрики и дашборд по желанию: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # открыт только на localhost, смотреть дашборд можно без входа
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/botwatch.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  rabbitmq-data:
  seq-data:
  prometheus-data:
  grafana-data:
