# Postgres как StatefulSet: у пода постоянное имя postgres-0 и свой PVC data-postgres-0.
# под можно удалить или пересоздать - новый postgres-0 подключит тот же том, данные останутся.
# скрипт инициализации (базы и пользователи на каждый сервис) берётся из compose, чтобы не дублировать:
# kubectl -n botwatch create configmap postgres-init --from-file=deploy/compose/postgres/init.sh
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: botwatch
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: botwatch
spec:
  # headless: DNS-имя postgres сразу указывает на IP пода, без виртуального IP сервиса.
  # нужен StatefulSet'у для имён вида postgres-0.postgres
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: botwatch
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: botwatch
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: botwatch
    spec:
      automountServiceAccountToken: false
      # postgres успевает сбросить данные на диск и корректно остановиться
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: botwatch-secrets, key: POSTGRES_PASSWORD }
            # подкаталог, а не корень тома: в корне у некоторых дисков лежит lost+found и initdb отказывается
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: botwatch-secrets, key: GATEWAY_DB_PASSWORD }
            - name: MONITORING_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: botwatch-secrets, key: MONITORING_DB_PASSWORD }
            - name: INCIDENTS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: botwatch-secrets, key: INCIDENTS_DB_PASSWORD }
            - name: TGPROBE_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: botwatch-secrets, key: TGPROBE_DB_PASSWORD }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # скрипты отсюда выполняются только при первом запуске, на пустом томе
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  # на каждый под свой PVC. при удалении StatefulSet PVC остаются - данные так просто не потерять
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
