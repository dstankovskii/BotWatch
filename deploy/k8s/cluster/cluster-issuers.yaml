# издатели сертификатов на весь кластер, ставятся после cert-manager.
# HTTP-01: Let's Encrypt запрашивает http://<домен>/.well-known/acme-challenge/...,
# cert-manager на время проверки поднимает под с ответом и свой Ingress на этот путь.
# you@example.com заменить: туда придут письма об истекающих сертификатах
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # тестовый сервер: лимиты щедрые, но браузер сертификату не доверяет
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
