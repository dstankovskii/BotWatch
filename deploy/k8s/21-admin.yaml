# статика SPA на nginx. снаружи не видна, отдаётся через gateway
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: botwatch
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: botwatch
spec:
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: botwatch
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: botwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/part-of: botwatch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: admin
          image: ghcr.io/OWNER/botwatch-admin:latest
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # nginx-unprivileged пишет pid и временные файлы в /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
