# единственный сервис, доступный снаружи (через Ingress). остальные он проксирует сам.
# строка подключения собирается из пароля в Secret: $(DB_PASSWORD) подставляет kubelet,
# если переменная объявлена выше в том же списке env
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: botwatch
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: botwatch
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: botwatch
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: botwatch
spec:
  # одна реплика: лимит попыток входа считается в памяти процесса
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  # новый под поднимается и проходит readiness, только потом гасится старый - обновление без простоя
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: botwatch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: ghcr.io/OWNER/botwatch-gateway:latest
          envFrom:
            - configMapRef: { name: botwatch-config }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: botwatch-secrets, key: GATEWAY_DB_PASSWORD }
            - name: ConnectionStrings__Gateway
              value: Host=postgres;Database=gateway;Username=gateway;Password=$(DB_PASSWORD)
            - name: Services__Monitoring
              value: http://monitoring:8080
            - name: Services__Incidents
              value: http://incidents:8080
            - name: Services__Admin
              value: http://admin:8080
            # перед шлюзом Traefik: настоящий IP клиента приходит в X-Forwarded-For.
            # подделать заголовок в обход Traefik не выйдет - это запрещает NetworkPolicy
            - name: Gateway__BehindProxy
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          # при старте сервис накатывает миграции и только потом слушает порт.
          # startupProbe даёт на это до 150 с, liveness до этого не включается
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          # лимита по CPU нет намеренно: троттлинг на маленьком VPS больнее, чем соседи
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
