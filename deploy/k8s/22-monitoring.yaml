apiVersion: v1
kind: Service
metadata:
  name: monitoring
  namespace: botwatch
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: botwatch
spec:
  selector:
    app.kubernetes.io/name: monitoring
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring
  namespace: botwatch
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: botwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monitoring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitoring
        app.kubernetes.io/part-of: botwatch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: monitoring
          image: ghcr.io/OWNER/botwatch-monitoring:latest
          envFrom:
            - configMapRef: { name: botwatch-config }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: botwatch-secrets, key: MONITORING_DB_PASSWORD }
            - name: ConnectionStrings__Monitoring
              value: Host=postgres;Database=monitoring;Username=monitoring;Password=$(DB_PASSWORD)
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef: { name: botwatch-secrets, key: RABBITMQ_USER }
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef: { name: botwatch-secrets, key: RABBITMQ_PASSWORD }
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
