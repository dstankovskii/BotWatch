name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build BotWatch.slnx -c Release

      # интеграционные тесты поднимают Postgres и RabbitMQ через Testcontainers, Docker на раннере уже есть.
      # по одному проекту: dotnet test на slnx с этим раннером не работает
      - name: Test
        run: |
          for project in tests/*/*.csproj; do
            dotnet test "$project" -c Release --no-build
          done

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - run: npm ci --no-fund --no-audit

      # типы API генерируются из снапшотов openapi, которые сверяют тесты бэкенда. забыли перегенерировать - падаем
      - name: API types are up to date
        run: |
          npm run api
          git diff --exit-code -- src/api

      - run: npm run lint
      - run: npm run build

  images:
    # образы публикуются только из main и только если всё зелёное
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, admin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: .
            project: src/Gateway/BotWatch.Gateway
            app: BotWatch.Gateway
          - name: monitoring
            context: .
            project: src/Monitoring/BotWatch.Monitoring.Api
            app: BotWatch.Monitoring.Api
          - name: incidents
            context: .
            project: src/Incidents/BotWatch.Incidents.Api
            app: BotWatch.Incidents.Api
          - name: http-probe
            context: .
            project: src/Probes/BotWatch.Probe.Http
            app: BotWatch.Probe.Http
          - name: tg-probe
            context: .
            project: src/Probes/BotWatch.Probe.Telegram
            app: BotWatch.Probe.Telegram
          - name: admin
            context: web/admin
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action приводит имя владельца к нижнему регистру, иначе GHCR отклонит тег
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/botwatch-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: |
            PROJECT=${{ matrix.project }}
            APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
